plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) {
    lp.withInputStream { localProps.load(it) }
}
def apiBase = localProps.getProperty('API_BASE_URL', 'https://api.crowdcam.co.za/')
def mapsKey = localProps.getProperty('MAPS_API_KEY', '')
def payFastEnabled = localProps.getProperty('PAYFAST_ENABLED', 'false').toBoolean()

android {
    namespace 'com.example.deliveryapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.deliveryapp'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'API_BASE_URL', "\"${apiBase}\""
        buildConfigField 'String', 'MAPS_API_KEY', "\"${mapsKey}\""
        buildConfigField 'boolean', 'PAYFAST_ENABLED', "${payFastEnabled}"
        manifestPlaceholders = [mapsApiKey: mapsKey]
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'com.google.android.libraries.places:places:3.5.0'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
}
